# Grimoire book configuration for the @deckyard/fsm documentation.

[book]
title = "@deckyard/fsm"
description = "Finite state machines: define states and transitions, check the definition, fire events with guards and hooks, load from TOML, YAML or JSON, draw as Mermaid or Graphviz"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
# Any of the ten built-in themes; run "grimoire themes" for the list.
theme = "ivy"
# The colour mode a first-time reader gets: auto, light, or dark.
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-fsm/"
repoUrl = "https://github.com/deckyard/deck-fsm"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-fsm/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
# The book is published as a site only.
enabled = false
